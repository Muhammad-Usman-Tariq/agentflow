<!DOCTYPE html>

                    "primary-container": "#cb4927",
                    "on-tertiary-fixed": "#001f27",
                    "on-primary-container": "#fffbff",
                    "outline": "#8d716a",
                    "surface-subtle": "#f5f4f2",
                    "tertiary": "#006579",
                    "page-bg": "#faf9f7",
                    "primary-fixed-dim": "#ffb4a2",
                    "surface-container-high": "#f0e6e0",
                    "on-primary-fixed": "#3c0700",
                    "on-surface-variant": "#59413b",
                    "text-tertiary": "#9d9893",
                    "inverse-surface": "#34302b",
                    "outline-variant": "#e1bfb7",
                    "on-secondary-fixed-variant": "#474746",
                    "inverse-primary": "#ffb4a2",

                    "inverse-on-surface": "#f8efe8",
                    "secondary": "#5f5e5e",
                    "on-error": "#ffffff",

            },
            "borderRadius": {
                    "DEFAULT": "0.25rem",
                    "lg": "0.5rem",
                    "xl": "0.75rem",
                    "full": "9999px"
            },
            "spacing": {
                    "margin-mobile": "16px",
                    "container-max": "1440px",
                    "unit": "4px",
                    "margin-desktop": "32px",
                    "gutter": "24px"

            "fontFamily": {
                    "code-sm": [

<body class="bg-page-bg min-h-screen flex items-center justify-center p-margin-mobile md:p-margin-desktop antialiased">
<main class="bg-surface-container-lowest border border-border-warm rounded-[16px] w-full max-w-[420px] p-[32px] shadow-[0_1px_3px_rgba(0,0,0,0.06)] relative overflow-hidden">
<!-- Decorative subtle gradient hint -->
<div class="absolute top-0 left-0 w-full h-1 bg-gradient-to-r from-surface-container-lowest via-primary to-surface-container-lowest opacity-20"></div>
<div class="text-center mb-[32px]">
<div class="inline-flex items-center justify-center w-12 h-12 rounded-xl bg-surface-container mb-4">
<span class="material-symbols-outlined text-primary font-bold" style="font-variation-settings: 'FILL' 1;">developer_board</span>
</div>
<h1 class="font-headline-md text-headline-md text-on-background mb-2 tracking-tight">Create Account</h1>
<p class="font-body-md text-body-md text-text-tertiary">Join DigitalSofts AI for high-velocity development.</p>
</div>
<form class="space-y-[20px]">
<div>
<label class="block font-label-caps text-label-caps text-on-surface mb-2 uppercase tracking-wider" for="fullName">Full Name</label>
<input class="w-full bg-surface-container-lowest border border-border-warm rounded-md font-body-md text-body-md text-on-background px-4 py-3 focus:outline-none focus:border-primary focus:ring-1 focus:ring-primary transition-all duration-200" id="fullName" placeholder="Jane Doe" type="text"/>
</div>
<div>
<label class="block font-label-caps text-label-caps text-on-surface mb-2 uppercase tracking-wider" for="email">Email Address</label>
<input class="w-full bg-surface-container-lowest border border-border-warm rounded-md font-body-md text-body-md text-on-background px-4 py-3 focus:outline-none focus:border-primary focus:ring-1 focus:ring-primary transition-all duration-200" id="email" placeholder="jane@example.com" type="email"/>
</div>
<div>
<label class="block font-label-caps text-label-caps text-on-surface mb-2 uppercase tracking-wider" for="password">Password</label>
<input class="w-full bg-surface-container-lowest border border-border-warm rounded-md font-body-md text-body-md text-on-background px-4 py-3 focus:outline-none focus:border-primary focus:ring-1 focus:ring-primary transition-all duration-200" id="password" placeholder="••••••••" type="password"/>
</div>
<div class="pt-2">
<button class="w-full bg-primary text-on-primary font-body-lg text-body-lg font-semibold rounded-lg py-3 hover:bg-surface-tint active:scale-[0.98] transition-all duration-200 shadow-sm flex items-center justify-center gap-2" type="button">
                    Create Account
                    <span class="material-symbols-outlined text-[18px]">arrow_forward</span>
</button>
</div>
</form>
<div class="mt-[32px] pt-[24px] border-t border-border-warm text-center">
<p class="font-body-md text-body-md text-text-tertiary">
                Already have an account? 
                <a class="text-primary hover:text-surface-tint font-semibold transition-colors duration-200 ml-1" href="#">Login</a>
</p>
</div>
</main>
</body></html>
